[package]
name = "cluster_dashboard"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cluster-dashboard"
path = "src/main.rs"

[dependencies]
resource_stats_types = { path = "../../../libs/resource_stats_types" }

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["config", "derive", "runtime", "http-proxy"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "serde_json"] }

ratatui = "0.30"
crossterm = "0.29"

rust_decimal = "1.39"
regex = "1.12"
